<!DOCTYPE html>
<html>
<head>
    <title>Assignment Front Page Generator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        canvas {
            border: 1px solid black;
            margin-top: 20px;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>

<h2>Front Page Generator</h2>

<!-- Form -->
<input type="text" id="name" placeholder="Enter Name"><br>
<input type="text" id="branch" placeholder="Enter Branch"><br>
<input type="text" id="subject" placeholder="Enter Subject"><br>
<input type="text" id="teacher" placeholder="Teacher Name"><br>
<input type="text" id="roll" placeholder="Roll No"><br>

<button onclick="generate()">Generate</button>
<button onclick="download()">Download</button>

<br>

<canvas id="canvas" width="800" height="1000"></canvas>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

// Load your image here
let img = new Image();
img.src = "frontpage.png"; // 🔥 put your image name here

img.onload = function() {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

canvas.addEventListener("click", function(e) {
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    console.log("X:", x, "Y:", y);

    ctx.fillText(`(${x},${y})`, x, y);
});

function generate() {
    // redraw image
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let name = document.getElementById("name").value;
    let branch = document.getElementById("branch").value;
    let subject = document.getElementById("subject").value;
    let teacher = document.getElementById("teacher").value;
    let roll = document.getElementById("roll").value;

    ctx.font = "bold 23px Arial";
    ctx.fillStyle = "black";

    // Adjust positions according to your image
    ctx.fillText( name, 414, 698);
    ctx.fillText( branch, 414, 738);
    ctx.fillText( subject, 235, 591);
    ctx.fillText( teacher, 414, 817);
    ctx.fillText( roll, 414, 780);
}

function download() {
    let link = document.createElement('a');
    link.download = 'frontpage.png';
    link.href = canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
